name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # Do not include the obsolete 'tools' package; it is no longer published
          # and is the default for this action, which fails sdkmanager.
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Prepare release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret; skipping the signed release bundle."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deyeview-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/deyeview-release.keystore" >> "$GITHUB_ENV"
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Bundle signed release AAB
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deyeview-android-debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload release AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deyeview-android-release
          if-no-files-found: error
          path: android/app/build/outputs/bundle/release/*.aab
